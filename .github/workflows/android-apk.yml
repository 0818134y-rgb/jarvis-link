name: Build Android APK

on:
  push:
    branches: [main]
    paths: ["android/**", "pc/**", "brain/**", ".github/workflows/android-apk.yml"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  pc-tests:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: PC版 自作AIエンジンのテスト
        working-directory: pc
        run: |
          pip install numpy requests pyyaml "websockets>=15" zeroconf
          python tests/test_brain.py
          python tests/test_link.py

  apk:
    runs-on: ubuntu-24.04   # Android SDK がプリインストール済み
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Android SDK
        run: |
          echo "sdk.dir=$ANDROID_HOME" > android/local.properties
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - name: 呼びかけ待ち受け用の日本語音声モデルを同梱
        run: |
          curl -sSL -o vosk-ja.zip https://alphacephei.com/vosk/models/vosk-model-small-ja-0.22.zip
          unzip -q vosk-ja.zip
          mkdir -p android/app/src/main/assets/vosk-ja
          cp -r vosk-model-small-ja-0.22/* android/app/src/main/assets/vosk-ja/
          echo "small-ja-0.22" > android/app/src/main/assets/vosk-ja/version.txt
          find android/app/src/main/assets/vosk-ja -maxdepth 2 | head -30

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build APK
        working-directory: android
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Unit tests
        working-directory: android
        run: gradle testDebugUnitTest --no-daemon
        continue-on-error: true

      - name: Rename APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk JARVIS.apk

      - uses: actions/upload-artifact@v4
        with:
          name: JARVIS-apk
          path: JARVIS.apk

      # スマホのブラウザから直接ダウンロードできるよう Releases にも置く
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-${{ github.run_number }}
          name: JARVIS Android ${{ github.run_number }}
          body: スマホでこのページを開き、JARVIS.apk をタップしてインストールしてください。
          files: JARVIS.apk
