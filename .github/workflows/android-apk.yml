name: Build Android APK

on:
  push:
    branches: [main]
    paths: ["android/**", ".github/workflows/android-apk.yml"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-24.04   # Android SDK がプリインストール済み
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Android SDK
        run: |
          echo "sdk.dir=$ANDROID_HOME" > android/local.properties
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build APK
        working-directory: android
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Unit tests
        working-directory: android
        run: gradle testDebugUnitTest --no-daemon
        continue-on-error: true

      - name: Rename APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk JARVIS.apk

      - uses: actions/upload-artifact@v4
        with:
          name: JARVIS-apk
          path: JARVIS.apk

      # スマホのブラウザから直接ダウンロードできるよう Releases にも置く
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-${{ github.run_number }}
          name: JARVIS Android ${{ github.run_number }}
          body: スマホでこのページを開き、JARVIS.apk をタップしてインストールしてください。
          files: JARVIS.apk
