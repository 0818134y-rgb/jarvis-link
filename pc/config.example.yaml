# config.yaml にコピーして使ってください (copy config.example.yaml config.yaml)

device:
  name: pc                      # 他端末から呼ばれる名前
  aliases: [パソコン, ピーシー, PC, コンピューター]

link:
  port: 8765
  token: ""                     # 空なら初回起動時に自動生成して .jarvis_token に保存・表示
  discovery: true               # 同一Wi-Fi内の自動発見 (mDNS)
  peers: []                     # 外出先用 例: ["100.101.102.103:8765"] (TailscaleのスマホIP)
  allow_remote_dangerous: false # true で他端末からの画面操作・シェル等も許可
  speak_notifications: false    # スマホから転送された通知を読み上げる (表示は常にする)

asr:
  model: small                  # tiny / base / small / medium / large-v3
  device: auto                  # auto / cuda / cpu
  compute_type: auto            # auto / int8 / float16
  wake_words: [ジャーヴィス, ジャービス, じゃーびす, jarvis]
  hotkey: ctrl+alt+j            # 押してから話すと、ウェイクワードなしで受け付け
  follow_up_seconds: 6          # 返答後この秒数はウェイクワードなしで続けて話せる

tts:
  voicevox_host: http://localhost:50021
  speaker: 13                   # VOICEVOX話者ID (13 = 青山龍星 ノーマル)
  speed: 1.1

safety:
  confirm_dangerous: true       # シェル実行・削除・移動の前に音声確認
